<!doctype html><html lang="en"><head><meta charset="utf-8"><title>React Codex GUI integration</title></head><body><div id="app"></div>
<script src="/framework.js"></script><script src="/react-dom.js"></script>
<script>
function App(){const [count,setCount]=React.useState(0);return React.createElement('main',{},
 React.createElement('h1',{},'React Preview'),
 React.createElement('button',{id:'inspect-target','data-source-file':'src/ReactApp.tsx',onClick:()=>setCount(value=>value+1)},'React button'),
 React.createElement('output',{id:'count'},String(count)))}
ReactDOM.createRoot(document.getElementById('app')).render(React.createElement(App));
</script></body></html>

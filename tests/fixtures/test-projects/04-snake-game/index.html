<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>贪吃蛇 · Snake</title>
<style>
:root{--bg:#0b1020;--panel:#151b2e;--line:#232c45;--ink:#e8eeff;--muted:#8a96b8;--accent:#4ade80;--food:#ff6b6b;font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:var(--ink);
background:radial-gradient(circle at 50% 0%,#1a2340 0,#0b1020 60%)}
.game{width:min(100%,520px)}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
h1{margin:0;font-size:22px;letter-spacing:-.5px}
h1 span{color:var(--accent)}
.hint{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.stat small{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.board-wrap{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#0e1428;box-shadow:0 20px 50px #0006}
canvas{display:block;width:100%;height:auto;touch-action:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;
background:#0b1020d9;backdrop-filter:blur(3px);transition:opacity .18s}
.overlay[hidden]{display:none}
.overlay h2{margin:0 0 6px;font-size:24px}
.overlay p{margin:0 0 16px;font-size:13px;color:var(--muted);line-height:1.7}
.btn{border:0;border-radius:11px;padding:12px 22px;font:inherit;font-weight:750;font-size:14px;cursor:pointer;
background:var(--accent);color:#06230f;transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
.btn:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.controls .btn{flex:1}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
#restart-btn{background:#2563eb;color:#fff}
.best{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
.best b{color:var(--accent)}
</style>
</head>
<body>
<div class="game">
  <header>
    <h1>贪吃蛇 <span>Snake</span></h1>
    <span class="hint">方向键 / WASD 控制</span>
  </header>

  <section class="stats">
    <div class="stat"><small>得分</small><b id="score">0</b></div>
    <div class="stat"><small>最高分</small><b id="best">0</b></div>
    <div class="stat"><small>难度</small><b id="level">1</b></div>
  </section>

  <div class="board-wrap">
    <canvas id="board" width="480" height="480" aria-label="贪吃蛇游戏区域" role="img"></canvas>
    <div class="overlay" id="overlay">
      <div>
        <h2 id="overlay-title">准备开始</h2>
        <p id="overlay-text">吃到红色果实得分，撞墙或撞到自己就结束。</p>
        <button class="btn" id="start-btn" type="button">开始游戏</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="restart-btn" type="button">重新开始</button>
    <button class="btn ghost" id="pause-btn" type="button">暂停</button>
  </div>
  <p class="best">历史最高 <b id="best-inline">0</b> 分</p>
</div>

<script>
(() => {
  'use strict';
  const CELL = 24;
  const COLS = 20;
  const ROWS = 20;
  const STORAGE_KEY = 'snake.best';
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const bestInlineEl = document.getElementById('best-inline');
  const levelEl = document.getElementById('level');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayText = document.getElementById('overlay-text');
  const startBtn = document.getElementById('start-btn');
  const restartBtn = document.getElementById('restart-btn');
  const pauseBtn = document.getElementById('pause-btn');

  let snake, dir, nextDir, food, score, best, timer, running, paused, speed;
  best = Number(localStorage.getItem(STORAGE_KEY) || 0);

  const sameCell = (a, b) => a.x === b.x && a.y === b.y;
  const inSnake = (cell) => snake.some(s => sameCell(s, cell));

  function spawnFood() {
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!inSnake({ x, y })) free.push({ x, y });
      }
    }
    if (free.length === 0) return null;
    return free[Math.floor(Math.random() * free.length)];
  }

  function reset() {
    clearTimeout(timer);
    running = false;
    paused = false;
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    food = spawnFood();
    score = 0;
    speed = 160;
    syncHud();
    pauseBtn.textContent = '暂停';
    overlay.hidden = true;
    draw();
  }

  function syncHud() {
    scoreEl.textContent = String(score);
    bestEl.textContent = String(best);
    bestInlineEl.textContent = String(best);
    levelEl.textContent = String(Math.min(9, 1 + Math.floor(score / 50)));
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#1a2138';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL + .5, 0);
      ctx.lineTo(i * CELL + .5, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL + .5);
      ctx.lineTo(canvas.width, i * CELL + .5);
      ctx.stroke();
    }
    if (food) {
      const cx = food.x * CELL + CELL / 2;
      const cy = food.y * CELL + CELL / 2;
      ctx.fillStyle = '#ff6b6b';
      ctx.beginPath();
      ctx.arc(cx, cy, CELL / 2 - 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffb3b3';
      ctx.beginPath();
      ctx.arc(cx - 4, cy - 4, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    snake.forEach((seg, i) => {
      const pad = i === 0 ? 1 : 2;
      ctx.fillStyle = i === 0 ? '#86efac' : '#4ade80';
      const r = 7;
      const x = seg.x * CELL + pad;
      const y = seg.y * CELL + pad;
      const w = CELL - pad * 2;
      ctx.beginPath();
      ctx.roundRect(x, y, w, w, r);
      ctx.fill();
    });
  }

  function gameOver() {
    running = false;
    clearTimeout(timer);
    if (score > best) {
      best = score;
      localStorage.setItem(STORAGE_KEY, String(best));
    }
    syncHud();
    overlayTitle.textContent = '游戏结束';
    overlayText.textContent = '本局得分 ' + score + ' 分，最高分 ' + best + ' 分。';
    startBtn.textContent = '再来一局';
    overlay.hidden = false;
  }

  function step() {
    if (!running || paused) return;
    if (nextDir.x !== -dir.x || nextDir.y !== -dir.y) dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const hitWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;
    const hitSelf = snake.some((seg, i) => i < snake.length - 1 && sameCell(seg, head));
    if (hitWall || hitSelf) {
      draw();
      gameOver();
      return;
    }
    snake.unshift(head);
    if (food && sameCell(head, food)) {
      score += 10;
      food = spawnFood();
      speed = Math.max(70, speed - 4);
      syncHud();
    } else {
      snake.pop();
    }
    draw();
    timer = setTimeout(step, speed);
  }

  function start() {
    reset();
    running = true;
    timer = setTimeout(step, speed);
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    pauseBtn.textContent = paused ? '继续' : '暂停';
    if (paused) {
      clearTimeout(timer);
      overlayTitle.textContent = '已暂停';
      overlayText.textContent = '按「继续」或空格键恢复游戏。';
      startBtn.textContent = '继续';
      overlay.hidden = false;
    } else {
      overlay.hidden = true;
      timer = setTimeout(step, speed);
    }
  }

  const KEYS = {
    ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
    w: { x: 0, y: -1 }, s: { x: 0, y: 1 }, a: { x: -1, y: 0 }, d: { x: 1, y: 0 },
  };

  document.addEventListener('keydown', (event) => {
    const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
    if (key === ' ') {
      event.preventDefault();
      if (!running) start();
      else togglePause();
      return;
    }
    const target = KEYS[key];
    if (!target) return;
    event.preventDefault();
    if (!running) return;
    if (paused) return;
    if (target.x === -dir.x && target.y === -dir.y) return;
    nextDir = target;
  });

  startBtn.addEventListener('click', () => {
    if (paused) { togglePause(); return; }
    start();
  });
  restartBtn.addEventListener('click', start);
  pauseBtn.addEventListener('click', togglePause);

  reset();
})();
</script>
</body>
</html>
